<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fidget Spinner</title>
  </head>
  <body>
    <canvas id="spinner-canvas"></canvas>
    <div id="ui-overlay">
      <div id="top-bar">
        <div id="rpm-display">
          <span id="rpm-value">0</span>
          <span id="rpm-label">RPM</span>
        </div>
        <div id="best-rpm-display">
          <span id="best-rpm-label">BEST</span>
          <span id="best-rpm-value">0</span>
        </div>
      </div>
      <div id="stats-panel" class="hidden">
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value" id="stat-spins">0</span>
            <span class="stat-label">Total Spins</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-time">0s</span>
            <span class="stat-label">Spin Time</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-longest">0s</span>
            <span class="stat-label">Longest Spin</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-milestones">0/5</span>
            <span class="stat-label">Milestones</span>
          </div>
        </div>
      </div>
      <div id="bottom-bar">
        <div id="controls-row">
          <button id="stats-btn" class="icon-btn" title="Stats">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <rect x="2" y="10" width="4" height="8" rx="1" fill="currentColor"/>
              <rect x="8" y="6" width="4" height="12" rx="1" fill="currentColor"/>
              <rect x="14" y="2" width="4" height="16" rx="1" fill="currentColor"/>
            </svg>
          </button>
          <div id="design-picker"></div>
          <button id="fullscreen-btn" class="icon-btn" title="Fullscreen">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6,2 2,2 2,6"/>
              <polyline points="14,2 18,2 18,6"/>
              <polyline points="6,18 2,18 2,14"/>
              <polyline points="14,18 18,18 18,14"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div id="hint" class="hint">Swipe or press arrow keys to spin</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
